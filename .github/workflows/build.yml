name: Buluvo Native WebView Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.24.5 (bilinen-çalışan sürüm)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Create base project
        run: flutter create --org com.buluvo --project-name buluvo_app --platforms=android app

      - name: Add dependencies
        working-directory: app
        run: |
          flutter pub add webview_flutter
          flutter pub add webview_flutter_android
          flutter pub add in_app_purchase
          flutter pub add url_launcher
          flutter pub add file_picker

      - name: Android permissions (INTERNET + Play Billing)
        working-directory: app
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="com.android.vending.BILLING"/>\n    <application#' "$MAN"
          echo "----- AndroidManifest.xml -----"
          sed -n '1,14p' "$MAN"

      - name: Inject app code
        run: cp custom/main.dart app/lib/main.dart

      - name: Build debug APK (imza gerektirmez — test kurulumu)
        working-directory: app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: buluvo-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
