name: Buluvo Native WebView Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create base project
        run: flutter create --org com.buluvo --project-name buluvo_app --platforms=android app

      - name: Add dependencies
        working-directory: app
        run: flutter pub add webview_flutter

      - name: Android permission (INTERNET)
        working-directory: app
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MAN"
          echo "----- AndroidManifest.xml -----"
          sed -n '1,12p' "$MAN"

      - name: Inject app code
        run: cp custom/main.dart app/lib/main.dart

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: buluvo-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
