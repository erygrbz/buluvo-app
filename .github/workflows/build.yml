name: Buluvo Native WebView Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create base project
        run: |
          flutter create --org com.buluvo --project-name buluvo_app --platforms=android app
          echo "project created"

      - name: Add dependencies
        working-directory: app
        run: |
          flutter pub add webview_flutter
          flutter pub add webview_flutter_android
          flutter pub add in_app_purchase
          flutter pub add url_launcher
          flutter pub add file_picker

      - name: Configure Android (applicationId, minSdk, version)
        working-directory: app
        run: |
          GRADLE=android/app/build.gradle
          # applicationId → com.buluvo.app (Play listesiyle aynı)
          sed -i 's/applicationId "com.buluvo.buluvo_app"/applicationId "com.buluvo.app"/' $GRADLE
          sed -i 's/applicationId = "com.buluvo.buluvo_app"/applicationId = "com.buluvo.app"/' $GRADLE
          sed -i 's/applicationId "com.buluvo.buluvoApp"/applicationId "com.buluvo.app"/' $GRADLE
          # minSdk 21 (webview + billing)
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' $GRADLE
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' $GRADLE
          sed -i 's/minSdk flutter.minSdkVersion/minSdk 21/' $GRADLE
          echo "----- build.gradle (app) -----"
          cat $GRADLE | grep -E "applicationId|minSdk" || true

      - name: Add Android permissions (INTERNET + Play Billing)
        working-directory: app
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          # INTERNET + BILLING izinleri (manifest tag'inden hemen sonra)
          sed -i 's#<manifest\(.*\)>#<manifest\1>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="com.android.vending.BILLING"/>#' $MAN
          echo "----- manifest head -----"
          head -n 12 $MAN

      - name: Inject app code
        run: |
          cp custom/main.dart app/lib/main.dart
          echo "main.dart copied"

      - name: Build release APK (debug-signed — test kurulumu için)
        working-directory: app
        run: flutter build apk --release

      - name: Build AAB (Play yüklemesi için — imzasız/debug)
        working-directory: app
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: buluvo-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: buluvo-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
